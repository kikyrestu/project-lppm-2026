<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Peta Jalan — Backend SI-LPPM</title>
<style>
:root{
  --bg-canvas:#0b0f17;
  --bg-grid:radial-gradient(circle,#1e293b 1.2px,transparent 1.2px);
  --bg-card:#131a26; --bg-card-header:#1a2334; --bg-card-hover:#172132;
  --bg-pill:rgba(255,255,255,.06);
  --border-card:#243247; --border-card-hover:#3d5477; --border-hairline:#1c2738;
  --text-primary:#f1f5f9; --text-secondary:#94a3b8; --text-muted:#64748b;
  --line-default:#475569;
  --st-selesai:#10b981; --st-berjalan:#6366f1; --st-belum:#475569;
  --card-shadow:0 10px 25px -5px rgba(0,0,0,.55),0 8px 10px -6px rgba(0,0,0,.5);
  --toolbar-bg:rgba(19,26,38,.92);
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg-canvas);color:var(--text-primary);overflow:hidden;
  font-family:'Plus Jakarta Sans',system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased}
.mono{font-family:'JetBrains Mono',ui-monospace,monospace}

/* ---------- toolbar ---------- */
.toolbar{position:fixed;top:0;left:0;right:0;z-index:80;height:56px;
  background:var(--toolbar-bg);backdrop-filter:blur(12px);
  border-bottom:1px solid var(--border-card);
  display:flex;align-items:center;gap:14px;padding:0 18px}
.mark{font-family:'JetBrains Mono',monospace;font-weight:700;font-size:11px;color:#fff;
  background:linear-gradient(135deg,#4f46e5,#06b6d4);padding:7px 9px;border-radius:7px;line-height:1.1;text-align:center}
.toolbar h1{font-size:15px;margin:0;font-weight:700}
.toolbar .sub{font-size:11px;color:var(--text-muted)}
/* indikator koneksi realtime — titik berdenyut + label status */
.live{display:flex;align-items:center;gap:7px;font-size:10.5px;font-weight:700;
  letter-spacing:.03em;text-transform:uppercase;color:var(--text-muted);
  border:1px solid var(--bd);border-radius:99px;padding:5px 11px;white-space:nowrap}
.live i{width:7px;height:7px;border-radius:50%;background:#64748b;
  animation:denyut 1.8s ease-in-out infinite}
@keyframes denyut{0%,100%{opacity:.35;transform:scale(.8)}50%{opacity:1;transform:scale(1.15)}}
.tools{margin-left:auto;display:flex;align-items:center;gap:7px}
.btn{background:var(--bg-card);border:1px solid var(--border-card);color:var(--text-secondary);
  border-radius:7px;padding:6px 10px;font-size:11.5px;cursor:pointer;font-family:inherit}
.btn:hover{border-color:var(--border-card-hover);color:var(--text-primary)}
.zoom{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--text-muted);
  min-width:42px;text-align:center}
.back{color:var(--text-secondary);font-size:12px;text-decoration:none}
.back:hover{color:var(--text-primary)}

/* ---------- legenda ---------- */
.legenda{position:fixed;bottom:16px;left:16px;z-index:80;background:var(--toolbar-bg);
  backdrop-filter:blur(12px);border:1px solid var(--border-card);border-radius:11px;
  padding:12px 14px;font-size:11.5px;color:var(--text-secondary);box-shadow:var(--card-shadow)}
.legenda b{display:block;font-size:10px;text-transform:uppercase;letter-spacing:.09em;
  color:var(--text-muted);margin-bottom:8px}
.legenda div.row{display:flex;align-items:center;gap:9px;margin:5px 0}
.swatch{width:26px;height:0;border-top-width:3px;border-top-style:solid;flex-shrink:0;border-radius:2px}
.s-selesai{border-color:var(--st-selesai)}
.s-berjalan{border-top-style:dashed;border-color:var(--st-berjalan);animation:geser 1s linear infinite}
.s-belum{border-top-style:dotted;border-color:var(--st-belum)}
@keyframes geser{to{border-top-color:var(--st-berjalan)}}

/* ---------- ringkasan atas ---------- */
.ringkas{position:fixed;top:66px;left:16px;z-index:70;display:flex;gap:9px;flex-wrap:wrap}
.chip{background:var(--bg-card);border:1px solid var(--border-card);border-radius:9px;
  padding:7px 11px;font-size:11px;color:var(--text-secondary);box-shadow:var(--card-shadow)}
.chip b{font-size:15px;font-weight:800;margin-right:4px}

/* ---------- viewport & canvas ---------- */
#viewport{position:fixed;top:0;left:0;right:0;bottom:0;overflow:hidden;
  background-image:var(--bg-grid);background-size:26px 26px;cursor:grab}
#viewport.grabbing{cursor:grabbing}
#canvas{position:absolute;top:0;left:0;transform-origin:0 0;will-change:transform}
#relationsSvg{position:absolute;top:0;left:0;width:100%;height:100%;
  pointer-events:none;overflow:visible;z-index:10}
#cardsContainer{position:absolute;top:0;left:0;width:100%;height:100%;z-index:20}

/* ---------- garis ---------- */
.garis{fill:none;stroke-linecap:round;stroke-linejoin:round}
.garis-selesai{stroke:var(--st-selesai);stroke-width:3.5}
.garis-berjalan{stroke:var(--st-berjalan);stroke-width:3.5;
  stroke-dasharray:15 13;animation:alir 1s linear infinite}
@keyframes alir{from{stroke-dashoffset:28}to{stroke-dashoffset:0}}
.garis-belum{stroke:var(--st-belum);stroke-width:2.5;stroke-dasharray:2 8;opacity:.75}
/* jalan raya utama */
.jalan{fill:none;stroke-linecap:round}
.jalan-selesai{stroke:var(--st-selesai);stroke-width:9;opacity:.28}
.jalan-berjalan{stroke:var(--st-berjalan);stroke-width:9;opacity:.28;
  stroke-dasharray:20 16;animation:alir 1.1s linear infinite}
.jalan-belum{stroke:var(--st-belum);stroke-width:7;opacity:.2;stroke-dasharray:3 11}

/* ---------- kartu fase (gaya entity-card ERD) ---------- */
.fase{position:absolute;background:var(--bg-card);border:1px solid var(--border-card);
  border-radius:10px;box-shadow:var(--card-shadow);cursor:pointer;
  transition:border-color .18s ease,box-shadow .18s ease}
.fase:hover{border-color:var(--border-card-hover);box-shadow:0 14px 30px -6px rgba(0,0,0,.6)}
.fase-head{padding:9px 12px;background:var(--bg-card-header);
  border-radius:9px 9px 0 0;border-bottom:1px solid var(--border-hairline);
  border-left:3.5px solid var(--line-default);display:flex;align-items:center;gap:9px}
.fase.selesai .fase-head{border-left-color:var(--st-selesai)}
.fase.berjalan .fase-head{border-left-color:var(--st-berjalan)}
.fase-no{font-family:'JetBrains Mono',monospace;font-size:10.5px;font-weight:700;
  background:var(--bg-pill);border:1px solid var(--border-hairline);
  padding:3px 7px;border-radius:5px;color:var(--text-secondary);white-space:nowrap}
.fase-title{font-size:13px;font-weight:700;flex:1;min-width:0;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fase-body{padding:8px 12px;display:flex;align-items:center;gap:10px}
.bar{flex:1;height:6px;background:#0a0e16;border:1px solid var(--border-hairline);
  border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--st-belum);border-radius:99px;transition:width .5s ease}
.fase.selesai .bar i{background:var(--st-selesai)}
.fase.berjalan .bar i{background:linear-gradient(90deg,#6366f1,#818cf8)}
.fase-cnt{font-family:'JetBrains Mono',monospace;font-size:10.5px;color:var(--text-muted);white-space:nowrap}

/* ---------- kartu item ---------- */
.item{position:absolute;background:var(--bg-card);border:1px solid var(--border-card);
  border-radius:8px;display:flex;align-items:center;gap:9px;padding:0 11px;
  font-size:11.5px;color:var(--text-secondary);transition:border-color .18s ease}
.item.aktif{cursor:pointer}
.item.aktif:hover{border-color:var(--border-card-hover);color:var(--text-primary)}
.item.selesai{color:#a7f3d0}
.item .kode{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--text-muted);
  background:var(--bg-pill);border:1px solid var(--border-hairline);
  padding:1.5px 5px;border-radius:4px;flex-shrink:0}
.item.selesai .kode{color:#6ee7b7}
.item .judul{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .tagx{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;
  padding:2px 6px;border-radius:4px;flex-shrink:0}
.t-selesai{background:rgba(16,185,129,.14);color:#34d399;border:1px solid rgba(16,185,129,.35)}
.t-berjalan{background:rgba(99,102,241,.16);color:#a5b4fc;border:1px solid rgba(99,102,241,.4)}
.t-belum{background:rgba(148,163,184,.1);color:var(--text-muted);border:1px solid var(--border-card)}

/* ikon */
.ico{width:17px;height:17px;flex-shrink:0}
.ico-selesai circle{fill:var(--st-selesai)}
.ico-selesai path{stroke:#04110b;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round}
.ico-berjalan circle.ring{fill:none;stroke:var(--st-berjalan);stroke-width:2.5;opacity:.35}
.ico-berjalan circle.dot{fill:var(--st-berjalan);transform-origin:50% 50%;animation:pompa 1.1s ease-in-out infinite}
@keyframes pompa{0%,100%{transform:scale(.62)}50%{transform:scale(1)}}
.ico-belum circle{fill:none;stroke:var(--line-default);stroke-width:2.5}

/* label pada garis */
.lbl-garis{font-family:'JetBrains Mono',monospace;font-size:9.5px;fill:var(--text-muted)}
.lbl-garis.aktif{fill:#a5b4fc}
.lbl-garis.habis{fill:#6ee7b7}
</style>
</head>
<body>

<div class="toolbar">
  <div class="mark">LPPM<br>PETA</div>
  <div>
    <h1>Peta Jalan Pengembangan Backend</h1>
    <div class="sub">Sistem Informasi LPPM · percabangan modul M1–M9</div>
  </div>
  <a class="back" href="/">← Roadmap</a>
  <div class="live" id="live"><i></i>menyambung…</div>
  <div class="tools">
    <button class="btn" id="zoomOut">−</button>
    <span class="zoom" id="zoomLv">100%</span>
    <button class="btn" id="zoomIn">+</button>
    <button class="btn" id="fit">Pas Layar</button>
    <button class="btn" id="reset">Reset Posisi</button>
  </div>
</div>

<div class="ringkas" id="ringkas"></div>

<div id="viewport">
  <div id="canvas">
    <svg id="relationsSvg"><g id="linesGroup"></g></svg>
    <div id="cardsContainer"></div>
  </div>
</div>

<div class="legenda">
  <b>Keterangan garis</b>
  <div class="row"><span class="swatch s-selesai"></span> Selesai — garis penuh hijau</div>
  <div class="row"><span class="swatch s-berjalan"></span> Sedang dikerjakan — garis putus-putus berjalan</div>
  <div class="row"><span class="swatch s-belum"></span> Belum dimulai — garis titik-titik redup</div>
  <div class="row" style="margin-top:9px;padding-top:8px;border-top:1px solid var(--border-hairline)">
    <svg class="ico ico-selesai" viewBox="0 0 20 20"><circle cx="10" cy="10" r="9"/><path d="M5.6 10.3l2.9 2.9 5.7-6"/></svg>
    Tugas selesai
  </div>
  <div class="row">
    <svg class="ico ico-berjalan" viewBox="0 0 20 20"><circle class="ring" cx="10" cy="10" r="8"/><circle class="dot" cx="10" cy="10" r="4.5"/></svg>
    Sedang dikerjakan
  </div>
  <div class="row">
    <svg class="ico ico-belum" viewBox="0 0 20 20"><circle cx="10" cy="10" r="8"/></svg>
    Belum dimulai
  </div>
</div>

<script>
const L = {
  fase:{ w:340, h:70, gap:64 },
  item:{ w:430, h:34, gap:9 },
  roadX:46, faseX:104, itemX:520,
  padAtas:96, padSamping:70
};

const state = { scale:1, tx:0, ty:0, data:null, layout:null };

/* ---------- util ---------- */
function el(tag, cls, html){ const e=document.createElement(tag); if(cls)e.className=cls; if(html!=null)e.innerHTML=html; return e; }
function ikon(st){
  if(st==='selesai') return '<svg class="ico ico-selesai" viewBox="0 0 20 20"><circle cx="10" cy="10" r="9"/><path d="M5.6 10.3l2.9 2.9 5.7-6"/></svg>';
  if(st==='berjalan') return '<svg class="ico ico-berjalan" viewBox="0 0 20 20"><circle class="ring" cx="10" cy="10" r="8"/><circle class="dot" cx="10" cy="10" r="4.5"/></svg>';
  return '<svg class="ico ico-belum" viewBox="0 0 20 20"><circle cx="10" cy="10" r="8"/></svg>';
}
/* jalur ortogonal dengan sudut membulat: H -> V -> H */
function orth(x1,y1,x2,y2,midX,r){
  r = r ?? 12;
  if(Math.abs(y2-y1) < 1.5) return `M ${x1} ${y1} L ${x2} ${y2}`;
  const sv = y2>y1?1:-1, sh = x2>midX?1:-1;
  r = Math.min(r, Math.abs(midX-x1), Math.abs(x2-midX), Math.abs(y2-y1)/2);
  return `M ${x1} ${y1} L ${midX-sh*r} ${y1} Q ${midX} ${y1} ${midX} ${y1+sv*r} `
       + `L ${midX} ${y2-sv*r} Q ${midX} ${y2} ${midX+sh*r} ${y2} L ${x2} ${y2}`;
}

/* ---------- susun tata letak ---------- */
function hitung(data){
  const nodes = [], links = [];
  let y = L.padAtas, maxR = 0;
  data.phases.forEach((ph, pi)=>{
    const tinggiItem = ph.items.length * (L.item.h + L.item.gap);
    const tinggiFase = Math.max(L.fase.h, tinggiItem);
    const st = ph.pct===100 ? 'selesai' : (ph.done>0 || ph.state==='berjalan' ? 'berjalan' : 'belum');

    nodes.push({t:'fase', no:ph.no, title:ph.title, goal:ph.goal||'', done:ph.done,
                total:ph.total, pct:ph.pct, status:st, x:L.faseX, y, w:L.fase.w, h:L.fase.h});

    const spineX = L.faseX + L.fase.w + 36;
    const cy = y + L.fase.h/2;
    let iy = y;
    ph.items.forEach(it=>{
      // status di data memakai bahasa Inggris (done/pending) — petakan ke gaya lokal
      const sti = it.status==='done' ? 'selesai'
                : it.status==='berjalan' ? 'berjalan' : 'belum';
      nodes.push({t:'item', id:it.id, title:it.title, status:sti, md:it.md,
                  x:L.itemX, y:iy, w:L.item.w, h:L.item.h, spineX, faseCy:cy});
      links.push({d:orth(spineX, iy+L.item.h/2, L.itemX, iy+L.item.h/2, spineX, 8), st:sti});
      iy += L.item.h + L.item.gap;
    });
    if(ph.items.length){
      links.push({d:`M ${spineX} ${cy} L ${spineX} ${y+L.item.h/2}`, st,
                  lbl:`${ph.done}/${ph.total}`});
    }
    links.push({d:`M ${L.faseX+L.fase.w} ${cy} L ${spineX} ${cy}`, st});

    nodes.push({t:'simpul', x:L.roadX, y:cy, status:st});
    links.push({d:`M ${L.roadX+11} ${cy} L ${L.faseX} ${cy}`, st});

    const bawah = y + tinggiFase;
    if(pi < data.phases.length-1){
      const yNext = bawah + L.fase.gap;
      links.push({d:`M ${L.roadX} ${cy+14} L ${L.roadX} ${yNext + L.fase.h/2 - 14}`, st, jalan:true});
    }
    nodes.push({t:'garis', x:L.roadX, y1:cy+14, y2:bawah+L.fase.gap, status:st});
    y = bawah + L.fase.gap;
    maxR = Math.max(maxR, L.itemX + L.item.w);
  });
  return {nodes, links, w:maxR + L.padSamping, h:y + 40};
}

/* ---------- render ---------- */
function render(){
  const data = state.data, lay = state.layout;
  const cards = document.getElementById('cardsContainer');
  const lines = document.getElementById('linesGroup');
  const svg = document.getElementById('relationsSvg');
  cards.innerHTML=''; lines.innerHTML='';
  svg.setAttribute('width', lay.w); svg.setAttribute('height', lay.h);
  document.getElementById('canvas').style.width = lay.w+'px';
  document.getElementById('canvas').style.height = lay.h+'px';

  // garis jalan raya (di bawah)
  lay.nodes.filter(n=>n.t==='garis').forEach(n=>{
    const p = document.createElementNS('http://www.w3.org/2000/svg','path');
    p.setAttribute('d', `M ${n.x} ${n.y1} L ${n.x} ${n.y2}`);
    p.setAttribute('class', 'jalan jalan-'+n.status);
    lines.appendChild(p);
  });
  // garis percabangan
  lay.links.forEach(k=>{
    const p = document.createElementNS('http://www.w3.org/2000/svg','path');
    p.setAttribute('d', k.d); p.setAttribute('class','garis garis-'+k.st);
    lines.appendChild(p);
    if(k.lbl){
      const m = k.d.match(/M\s([\d.]+)\s([\d.]+)/);
      const t = document.createElementNS('http://www.w3.org/2000/svg','text');
      t.setAttribute('x', +m[1]-2); t.setAttribute('y', +m[2]-9);
      t.setAttribute('text-anchor','end');
      t.setAttribute('class','lbl-garis '+(k.st==='selesai'?'habis':k.st==='berjalan'?'aktif':''));
      t.textContent = k.lbl; lines.appendChild(t);
    }
  });

  // kartu simpul jalan
  lay.nodes.filter(n=>n.t==='simpul').forEach(n=>{
    const c = el('div');
    c.style.cssText = `position:absolute;left:${n.x-11}px;top:${n.y-11}px;width:22px;height:22px;z-index:15`;
    c.innerHTML = ikon(n.status);
    cards.appendChild(c);
  });

  // kartu fase
  lay.nodes.filter(n=>n.t==='fase').forEach(n=>{
    const c = el('div', 'fase '+n.status);
    c.style.cssText = `left:${n.x}px;top:${n.y}px;width:${n.w}px;min-height:${n.h}px`;
    c.innerHTML =
      `<div class="fase-head">${ikon(n.status)}<span class="fase-no">${n.no}</span>
         <span class="fase-title">${n.title}</span></div>
       <div class="fase-body"><span class="bar"><i style="width:${n.pct}%"></i></span>
         <span class="fase-cnt">${n.done}/${n.total}</span></div>`;
    cards.appendChild(c);
  });

  // kartu item
  lay.nodes.filter(n=>n.t==='item').forEach(n=>{
    const c = el('div', 'item '+n.status+(n.md?' aktif':''));
    c.style.cssText = `left:${n.x}px;top:${n.y}px;width:${n.w}px;height:${n.h}px`;
    const tag = n.status==='selesai'?'Selesai':n.status==='berjalan'?'Proses':'Rencana';
    c.innerHTML = `${ikon(n.status)}<span class="kode">${n.id}</span>
      <span class="judul">${n.title}</span><span class="tagx t-${n.status}">${tag}</span>`;
    if(n.md) c.onclick = ()=>window.open('/entry/'+n.id,'_blank');
    cards.appendChild(c);
  });
}

/* ---------- zoom & geser ---------- */
function terapkan(){ document.getElementById('canvas').style.transform =
  `translate(${state.tx}px,${state.ty}px) scale(${state.scale})`;
  document.getElementById('zoomLv').textContent = Math.round(state.scale*100)+'%'; }

function fit(){
  const vw = innerWidth, vh = innerHeight;
  const s = Math.min((vw-40)/state.layout.w, (vh-120)/state.layout.h, 1.25);
  state.scale = Math.max(0.16, s);
  state.tx = (vw - state.layout.w*state.scale)/2;
  state.ty = 74 + Math.max(0, (vh-100 - state.layout.h*state.scale)/2);
  terapkan();
}

function pasangGeser(){
  const vp = document.getElementById('viewport');
  let down=false, sx=0, sy=0, ox=0, oy=0;
  vp.addEventListener('mousedown', e=>{ down=true; sx=e.clientX; sy=e.clientY; ox=state.tx; oy=state.ty; vp.classList.add('grabbing'); });
  addEventListener('mousemove', e=>{ if(!down)return; state.tx=ox+(e.clientX-sx); state.ty=oy+(e.clientY-sy); terapkan(); });
  addEventListener('mouseup', ()=>{ down=false; vp.classList.remove('grabbing'); });
  vp.addEventListener('wheel', e=>{
    e.preventDefault();
    const k = e.deltaY<0 ? 1.12 : 0.89;
    const ns = Math.min(2.4, Math.max(0.16, state.scale*k));
    const r = ns/state.scale;
    state.tx = e.clientX - (e.clientX-state.tx)*r;
    state.ty = e.clientY - (e.clientY-state.ty)*r;
    state.scale = ns; terapkan();
  }, {passive:false});
}

/* ---------- jalan ---------- */
/* Muat data progres lalu gambar ulang. Aman dipanggil berulang:
   posisi geser & zoom sengaja TIDAK direset supaya perubahan realtime
   tidak mengganggu pemandangan pengguna. */
async function muat(pertama = false){
  const res = await fetch('/api/progress', {cache:'no-store'});
  state.data = await res.json();
  state.layout = hitung(state.data);

  const kunciSebelum = state.layout ? null : null;
  render();

  const o = state.data.overall;
  document.getElementById('ringkas').innerHTML =
    `<span class="chip"><b style="color:#34d399">${o.done}</b>/${o.total} tugas selesai</span>` +
    `<span class="chip"><b>${o.pct}%</b>progres</span>` +
    state.data.phases.map(p=>{
      const st = p.pct===100?'selesai':(p.done>0?'berjalan':'belum');
      const c = st==='selesai'?'#34d399':st==='berjalan'?'#a5b4fc':'#64748b';
      return `<span class="chip" style="border-left:3px solid ${c}">${p.no}</span>`;
    }).join('');

  if (pertama){
    fit(); pasangGeser();
    document.getElementById('fit').onclick = fit;
    document.getElementById('reset').onclick = ()=>{ state.scale=1; state.tx=20; state.ty=74; terapkan(); };
    document.getElementById('zoomIn').onclick = ()=>{ state.scale=Math.min(2.4,state.scale*1.2); terapkan(); };
    document.getElementById('zoomOut').onclick= ()=>{ state.scale=Math.max(0.16,state.scale/1.2); terapkan(); };
    addEventListener('resize', fit);
  }
}

/* ---------- realtime ---------- */
/* Jalur: penulis memperbarui roadmap.json -> server mendeteksi mtime berubah
   -> /api/stream mendorong pesan -> di sini kita muat ulang data.
   Bila SSE tidak tersedia, jatuh ke polling biasa tiap 5 detik. */
const Live = {
  sse: null, polling: null, gagal: 0,
  el: null,
  set(status, warna){
    if(!this.el) this.el = document.getElementById('live');
    if(!this.el) return;
    this.el.innerHTML = `<i style="background:${warna}"></i>${status}`;
    this.el.style.borderColor = warna;
  },
  mulai(){
    this.set('menyambung…', '#64748b');
    try {
      this.sse = new EventSource('/api/stream');
      this.sse.onopen = ()=>{ this.gagal = 0; this.set('REALTIME aktif', '#34d399'); };
      this.sse.onmessage = async (e)=>{
        const d = JSON.parse(e.data);
        if (d.tipe === 'berubah'){
          this.set(`diperbarui ${new Date().toLocaleTimeString('id-ID')}`, '#38bdf8');
          await muat(false);
        } else if (d.tipe === 'tutup'){
          this.sse.close(); this.mulaiPolling('koneksi ditutup');
        }
      };
      this.sse.onerror = ()=>{
        // biarkan EventSource mencoba ulang sendiri; kalau terus gagal,
        // ambil alih dengan polling supaya peta tetap hidup.
        this.gagal++;
        this.set('menyambung ulang…', '#f59e0b');
        if (this.gagal >= 4){ this.sse.close(); this.mulaiPolling('SSE gagal'); }
      };
    } catch(err){
      this.mulaiPolling('SSE tidak didukung');
    }
  },
  mulaiPolling(alasan){
    this.set(`polling (5 dtk) — ${alasan}`, '#f59e0b');
    if (this.polling) return;
    this.polling = setInterval(async ()=>{
      await muat(false);
      this.set(`polling — ${new Date().toLocaleTimeString('id-ID')}`, '#f59e0b');
    }, 5000);
  }
};

(async function(){
  await muat(true);
  Live.mulai();
})();
</script>
